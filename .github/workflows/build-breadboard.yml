name: Build BreadBoard Launcher APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release APK
        run: |
          gradle assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BreadBoard-Native-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v2.0.0-native --yes 2>/dev/null || true
          gh release create v2.0.0-native app/build/outputs/apk/release/*.apk \
            --title "BreadBoard Launcher v2.0.0 Native" \
            --notes "Native ultra-lightweight Android 5.1 launcher for Apple HomeView Smart Display with zero-login injection and zero bloat."
