name: Build BreadBoard Launcher APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Install Dependencies
        working-directory: app
        run: |
          flutter pub get

      - name: Patch Flutter Embedding Jar for Android 5.1 Compatibility
        working-directory: app
        run: |
          cd android
          ./gradlew :app:dependencies || true
          cd ..
          python3 -c "
          import os, zipfile, tempfile, shutil

          target = bytes.fromhex('bb002e59b700304d2bb6003d4e2db60043360403360515051504a2001a2d1505b600493a062c1906b9006d020057840501a7ffe52ab400162cb6008eb1')
          replacement = bytes.fromhex('bb002e59b700304d2ab400162cb6008eb1' + '00' * 44)

          gradle_cache = os.path.expanduser('~/.gradle/caches')
          patched_count = 0
          for root, dirs, files in os.walk(gradle_cache):
              for f in files:
                  if f.startswith('flutter_embedding_release') and f.endswith('.jar'):
                      p = os.path.join(root, f)
                      try:
                          with zipfile.ZipFile(p, 'r') as zin:
                              if 'io/flutter/plugin/localization/LocalizationPlugin.class' not in zin.namelist():
                                  continue
                              raw = zin.read('io/flutter/plugin/localization/LocalizationPlugin.class')
                              if target not in raw:
                                  print('Target already patched or not present in:', p)
                                  continue
                              patched_raw = raw.replace(target, replacement, 1)
                              
                              tmp = tempfile.mktemp(suffix='.jar')
                              with zipfile.ZipFile(tmp, 'w') as zout:
                                  for item in zin.infolist():
                                      if item.filename == 'io/flutter/plugin/localization/LocalizationPlugin.class':
                                          zout.writestr(item, patched_raw)
                                      else:
                                          zout.writestr(item, zin.read(item.filename))
                              shutil.move(tmp, p)
                              patched_count += 1
                              print('Successfully patched flutter embedding jar for Android 5.1:', p)
                      except Exception as e:
                          print('Error inspecting jar:', p, e)
          print(f'Total flutter embedding jars patched: {patched_count}')
          "

      - name: Build Release APKs (Split per ABI)
        working-directory: app
        run: |
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Stage & Rename APKs
        run: |
          mkdir -p dist
          APK_DIR="app/build/app/outputs/flutter-apk"
          
          if [ -f "$APK_DIR/app-armeabi-v7a-release.apk" ]; then
            cp "$APK_DIR/app-armeabi-v7a-release.apk" dist/BreadBoard-armeabi-v7a.apk
          fi
          if [ -f "$APK_DIR/app-arm64-v8a-release.apk" ]; then
            cp "$APK_DIR/app-arm64-v8a-release.apk" dist/BreadBoard-arm64-v8a.apk
          fi
          if [ -f "$APK_DIR/app-release.apk" ]; then
            cp "$APK_DIR/app-release.apk" dist/BreadBoard-universal.apk
          fi
          
          echo "Staged APKs:"
          ls -la dist/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: breadboard-apks
          path: dist/*.apk
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "Marius Schaffrath (Antigravity CI)"
          git config --global user.email "antigravity@marius.local"
          
          TAG="v1.0.0-breadboard"
          git tag -f "$TAG" || true
          git push -f origin "$TAG" || true
          
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" dist/*.apk \
            --title "BreadBoard Launcher v1.0.0 (Apple HomeView)" \
            --notes "Custom Apple HomeView Smart Display Launcher for Fire 7 and Home Assistant. Features: Branded as BreadBoard (Apple Software 27.2 Leak), Pre-configured Zero-Config for Home Assistant, Fullscreen Kiosk, Optimized for Fire 7 hardware (armeabi-v7a / arm64-v8a)."
