name: Build BreadBoard Launcher APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Install Dependencies
        working-directory: app
        run: |
          flutter pub get

      - name: Build Release APKs (Split per ABI)
        working-directory: app
        run: |
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Patch APKs for Android 5.1 Compatibility and Re-sign
        run: |
          curl -sL -o /tmp/uber-apk-signer.jar "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar"
          
          python3 -c "
          import os, glob, zipfile, struct, hashlib, zlib, subprocess

          apks = glob.glob('app/build/app/outputs/flutter-apk/*.apk')
          print('Found APKs to check:', apks)

          for apk_path in apks:
              if 'signed' in apk_path.lower():
                  continue
              patched = False
              tmp_apk = apk_path + '.tmp'
              with zipfile.ZipFile(apk_path, 'r') as zin, zipfile.ZipFile(tmp_apk, 'w', zipfile.ZIP_DEFLATED) as zout:
                  for item in zin.infolist():
                      if item.filename.startswith('META-INF/'):
                          continue
                      data = bytearray(zin.read(item.filename))
                      if item.filename.endswith('.dex') and b'Lio/flutter/plugin/localization/LocalizationPlugin;' in data:
                          pos = data.find(b'Lio/flutter/plugin/localization/LocalizationPlugin;')
                          code_needle = bytes.fromhex('220038087010731c')
                          cpos = data.find(code_needle)
                          if cpos != -1:
                              print(f'Patching LocalizationPlugin in {item.filename} of {apk_path} at offset {hex(cpos)}')
                              data[cpos] = 0x0e
                              data[cpos + 1] = 0x00
                              for k in range(2, 97 * 2):
                                  data[cpos + k] = 0x00
                              sha1 = hashlib.sha1(data[32:]).digest()
                              data[12:32] = sha1
                              adler = zlib.adler32(data[12:]) & 0xffffffff
                              data[8:12] = struct.pack('<I', adler)
                              patched = True
                      zout.writestr(item, data)
              if patched:
                  os.replace(tmp_apk, apk_path)
                  print('Re-signing patched APK:', apk_path)
                  subprocess.run(['java', '-jar', '/tmp/uber-apk-signer.jar', '--apks', apk_path, '--overwrite'], check=True)
              else:
                  if os.path.exists(tmp_apk): os.remove(tmp_apk)
          "

      - name: Stage & Rename APKs
        run: |
          mkdir -p dist
          APK_DIR="app/build/app/outputs/flutter-apk"
          
          if [ -f "$APK_DIR/app-armeabi-v7a-release.apk" ]; then
            cp "$APK_DIR/app-armeabi-v7a-release.apk" dist/BreadBoard-armeabi-v7a.apk
          fi
          if [ -f "$APK_DIR/app-arm64-v8a-release.apk" ]; then
            cp "$APK_DIR/app-arm64-v8a-release.apk" dist/BreadBoard-arm64-v8a.apk
          fi
          if [ -f "$APK_DIR/app-release.apk" ]; then
            cp "$APK_DIR/app-release.apk" dist/BreadBoard-universal.apk
          fi
          
          echo "Staged APKs:"
          ls -la dist/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: breadboard-apks
          path: dist/*.apk
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "Marius Schaffrath (Antigravity CI)"
          git config --global user.email "antigravity@marius.local"
          
          TAG="v1.0.0-breadboard"
          git tag -f "$TAG" || true
          git push -f origin "$TAG" || true
          
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" dist/*.apk \
            --title "BreadBoard Launcher v1.0.0 (Apple HomeView)" \
            --notes "Custom Apple HomeView Smart Display Launcher for Fire 7 and Home Assistant. Features: Branded as BreadBoard (Apple Software 27.2 Leak), Pre-configured Zero-Config for Home Assistant, Fullscreen Kiosk, Optimized for Fire 7 hardware (armeabi-v7a / arm64-v8a)."
