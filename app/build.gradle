plugins {
    id 'com.android.application'
}

android {
    namespace 'me.jxl.breadboard'
    compileSdk 34

    defaultConfig {
        applicationId 'me.jxl.breadboard'
        minSdk 21
        targetSdk 22
        versionCode 2
        versionName '2.0.0-native'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Zero dependencies
}
